[package]
name = "chaperone-core"
description = "Chaperone core library: models, IR, engine, ledger, storage, cache, escalation, compiler, decision"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23.1"
cedar-policy = "4.12.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
ed25519-dalek = { version = "3.0.0", features = ["signature"] }
futures-util = "0.3.34"
redis = { version = "1.6.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
