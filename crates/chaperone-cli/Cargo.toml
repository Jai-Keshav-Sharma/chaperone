[package]
name = "chaperone-cli"
description = "The chaperone binary: init, hook, serve, gateway, shim, doctor, policy/ledger/approve commands"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "chaperone"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chaperone-core = { path = "../chaperone-core" }
chaperone-server = { path = "../chaperone-server" }
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "env"] }
hmac = "0.13.0"
redis = { version = "1.6.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
ureq = { version = "3.4.0", default-features = false, features = ["json"] }
uuid = { version = "1.26.0", features = ["v4"] }
