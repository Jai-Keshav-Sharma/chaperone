[package]
name = "chaperone-bench"
description = "The Chaperone benchmark harness (Flow 10): scenario corpus, attack generators, runner, metrics (E1-E6)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
chaperone-core = { path = "../chaperone-core" }
chaperone-server = { path = "../chaperone-server" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
rand = { version = "0.9", features = ["small_rng"] }
rand_chacha = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "time"] }
ureq = { version = "3.4.0", default-features = false, features = ["json"] }

[dev-dependencies]
statrs = "0.18"
