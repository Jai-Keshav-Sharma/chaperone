# git-cliff configuration — generates CHANGELOG.md from conventional commits.
# Run: `git cliff --latest` or `make changelog`. Never hand-edit CHANGELOG.md.

[remote.github]
owner = "Jai-Keshav-Sharma"
repo = "warden"
trim = true

[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.
Format: [Keep a Changelog](https://keepachangelog.com/en/1.1.0/); versions follow [SemVer](https://semver.org).
Generated by [git-cliff](https://github.com/orhun/git-cliff) from conventional commits — do not edit by hand.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
  ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.remote.url }}/commit/{{ commit.id }}))
{%- endfor %}
{%- endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Reverted" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore", group = "Miscellaneous" },
  { message = ".*", group = "Miscellaneous" },
]
