<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090b0f"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="957" height="297" rx="18" fill="url(#bg)" stroke="#26292f" stroke-width="1.5"/>

  <circle cx="38" cy="40" r="5" fill="#3f444c"/>
  <circle cx="58" cy="40" r="5" fill="#3f444c"/>
  <circle cx="78" cy="40" r="5" fill="#3f444c"/>
  <text x="922" y="45" text-anchor="end" font-size="13" fill="#565b63">$ chaperone serve</text>

  <text x="70" y="146" font-size="64" font-weight="700" fill="#e6e8eb" letter-spacing="2">chaperone</text>
  <rect x="440" y="98" width="34" height="58" fill="#10b981">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="190" font-size="19" fill="#9ba1a8">deterministic authorization gate for ai agents</text>

  <!-- verdict chip: ALLOW (0-2s), BLOCK (2-4s), ESCALATE (4-6s), cycling -->
  <g font-size="17">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="6s" begin="0s" repeatCount="indefinite"/>
      <rect x="70" y="216" width="128" height="42" rx="10" fill="#10b9811a" stroke="#10b981" stroke-width="1.2"/>
      <text x="88" y="243" fill="#34d399" font-weight="700">&#9654; ALLOW</text>
      <text x="216" y="243" fill="#565b63">forwarded, ledgered</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="6s" begin="2s" repeatCount="indefinite"/>
      <rect x="70" y="216" width="118" height="42" rx="10" fill="#ef44441a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="88" y="243" fill="#f87171" font-weight="700">&#9632; BLOCK</text>
      <text x="206" y="243" fill="#565b63">no side effects, receipt issued</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="6s" begin="4s" repeatCount="indefinite"/>
      <rect x="70" y="216" width="164" height="42" rx="10" fill="#f59e0b1a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="88" y="243" fill="#fbbf24" font-weight="700">&#9670; ESCALATE</text>
      <text x="252" y="243" fill="#565b63">human inbox, params-bound approval</text>
    </g>
  </g>
</svg>
